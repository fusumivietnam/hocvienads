name: Blogger Theme Check

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'

jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate and build
        run: npm run check

      - name: Upload built Blogger XML
        uses: actions/upload-artifact@v4
        with:
          name: hocvienads-blogger-theme
          path: dist/hocvienads.xml
          if-no-files-found: error
