name: Blogger Theme Check

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/theme-check.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/theme-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blogger-theme-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    name: Validate and verify Blogger theme
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate, build and verify integrity
        run: npm run check

      - name: Upload built Blogger XML
        uses: actions/upload-artifact@v4
        with:
          name: hocvienads-blogger-theme
          path: dist/hocvienads.xml
          if-no-files-found: error
          retention-days: 7
